# Builds a signed arm64 APK tuned for one phone, the Galaxy S23 (Snapdragon 8 Gen 2, SM8550).
# It installs beside the upstream app as "Phonon S23" and includes the CPU benchmark screen.
#
# Signing: add these repository secrets to keep one key across builds, so new builds install
# over old ones and keep the downloaded model:
#   SIGNING_KEYSTORE_BASE64  base64 of a .jks/.p12 keystore
#   SIGNING_KEYSTORE_PASSWORD, SIGNING_KEY_ALIAS, SIGNING_KEY_PASSWORD
# Without them, each build is signed with a throwaway key and must be installed fresh.
name: Build for Galaxy S23

on:
  push:
    branches: [s23-benchmark]
    paths-ignore: ['**.md', 'docs/**', 'fastlane/**', 'fdroid/**']
  workflow_dispatch:
    inputs:
      arm64_features:
        description: 'Rust target features. The S23 also has +i8mm; try "+dotprod,+fp16,+i8mm" as an experiment.'
        default: '+dotprod,+fp16'
        required: false

permissions:
  contents: read

concurrency:
  group: build-s23-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUST_VERSION: 1.99.1
      CARGO_NDK_VERSION: 4.1.2
      NDK_VERSION: 27.2.12479018
      BUILD_TOOLS: 36.0.0
      # One phone: arm64 only, with the CPU features every S23 core has.
      ANDROID_ABIS: arm64-v8a
      ARM64_FEATURES: ${{ inputs.arm64_features || '+dotprod,+fp16' }}
      # Whole-program optimization for the native library; slower to build, a little faster to run.
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "ndk;$NDK_VERSION" "platforms;android-37.0" "build-tools;$BUILD_TOOLS" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Rust toolchain
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal \
            --target aarch64-linux-android,x86_64-linux-android
          rustup default "$RUST_VERSION"

      - name: Cache key
        # Cache keys cannot contain commas: "+dotprod,+fp16" becomes "dotprod-fp16".
        run: echo "RUST_CACHE_KEY=s23-$(echo "$ARM64_FEATURES" | tr -d '+' | tr ',' '-')" >> "$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.RUST_CACHE_KEY }}

      - name: cargo-ndk
        run: cargo ndk --version 2>/dev/null | grep -qx "cargo-ndk $CARGO_NDK_VERSION" || cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked

      - name: Native library (arm64, ${{ env.ARM64_FEATURES }})
        run: bash android/build.sh

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: APK
        working-directory: android/tts-engine
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PphononIdSuffix=.s23 \
            "-PphononLabel=Phonon S23" \
            -PphononVersionCode=$((1000 + GITHUB_RUN_NUMBER)) \
            -PphononVersionSuffix=-s23.$GITHUB_RUN_NUMBER

      - name: Sign
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=android/tts-engine/build/outputs/apk/release/phonon-tts-engine-release-unsigned.apk
          keystore="$RUNNER_TEMP/signing.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          else
            echo "::warning::No signing secrets: using a throwaway key. Uninstall the previous Phonon S23 build before installing this one."
            KEYSTORE_PASSWORD=$(openssl rand -hex 16); KEY_PASSWORD=$KEYSTORE_PASSWORD; KEY_ALIAS=throwaway
            keytool -genkeypair -keystore "$keystore" -storetype PKCS12 -storepass "$KEYSTORE_PASSWORD" \
              -alias "$KEY_ALIAS" -keyalg RSA -keysize 3072 -validity 365 -dname "CN=Phonon S23 throwaway" > /dev/null
          fi
          mkdir -p out
          name="phonon-s23-$GITHUB_RUN_NUMBER.apk"
          "$tools/zipalign" -P 16 -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$keystore" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD --out "out/$name" "$RUNNER_TEMP/aligned.apk"
          rm -f "$keystore"
          "$tools/apksigner" verify --print-certs "out/$name" | grep -i "SHA-256 digest"
          (cd out && sha256sum "$name" > "$name.sha256")
          echo "### Phonon S23 build $GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"
          echo "Features: \`$ARM64_FEATURES\` · SHA-256: \`$(cut -d' ' -f1 out/$name.sha256)\`" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: phonon-s23-${{ github.run_number }}
          path: out/
          retention-days: 30
